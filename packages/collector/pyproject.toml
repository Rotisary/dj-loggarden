[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-loggarden-harvest"
version = "0.1.0"
description = "A Django-native log collector with structured storage and request/user context tracking."
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Oladotun Kolapo" }
]

license = { text = "MIT" }

dependencies = [
    "Django>=3.2",
]

keywords = ["django", "logging", "loguru", "observability", "debugging"]

classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
loguru = ["loguru>=0.7.0"]

[tool.setuptools.packages.find]
where = ["."]